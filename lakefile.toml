name = "poincareConjecture"
version = "0.1.0"
defaultTargets = ["PoincareConjecture"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export"
rev = "15f6055e299ad5b89345e533cc2192f4cc00f659"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator"
rev = "3927ad383f208ae977c340a91c48ac9b497d2097"

[[lean_lib]]
name = "PoincareConjecture"
globs = ["PoincareConjecture", "PoincareConjecture.+"]

[[lean_lib]]
name = "Challenge"
srcDir = "Comparator"

[[lean_lib]]
name = "Solution"
srcDir = "Comparator"
